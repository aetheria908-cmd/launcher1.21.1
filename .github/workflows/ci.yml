name: Pruebas
on:
  push:
    branches: [main]
    paths-ignore: ['manifest/manifest.json', 'docs/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
      - run: npm test
