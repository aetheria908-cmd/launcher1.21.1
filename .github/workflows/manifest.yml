# Regenera manifest/manifest.json (hashes SHA-256, tamaños, historial) cada vez que subes recursos.
name: Actualizar manifiesto
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'manifest/manifest.base.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/build-manifest.js
      - name: Publicar manifiesto
        run: |
          git config user.name "aetheria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest/manifest.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "chore: actualizar manifiesto [skip ci]" && git push; fi
