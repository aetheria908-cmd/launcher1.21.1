# Compila el instalador de Windows y lo publica en GitHub Releases (el actualizador del launcher lo detecta solo).
# Uso: Actions → "Publicar launcher" → Run workflow. Sube antes la versión en package.json.
name: Publicar launcher
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: node tools/make-icon.js
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
