<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: file:; media-src file:; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="bg" aria-hidden="true">
  <svg id="castle" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a22"/><stop offset=".55" stop-color="#2b1749"/><stop offset="1" stop-color="#6a3a28"/></linearGradient>
      <radialGradient id="moon"><stop offset="0" stop-color="#f3e4b8" stop-opacity=".75"/><stop offset="1" stop-color="#f3e4b8" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1200" height="520" fill="url(#sky)"/>
    <circle cx="930" cy="130" r="130" fill="url(#moon)"/><circle cx="930" cy="130" r="32" fill="#f1e2b6"/>
    <g fill="#f1e2b6" opacity=".7"><circle cx="120" cy="70" r="1.6"/><circle cx="260" cy="130" r="1.2"/><circle cx="410" cy="55" r="1.8"/><circle cx="640" cy="90" r="1.3"/><circle cx="760" cy="40" r="1.5"/><circle cx="1090" cy="85" r="1.7"/><circle cx="1150" cy="190" r="1.2"/><circle cx="60" cy="210" r="1.4"/></g>
    <path d="M0 520V390L90 330l70 50 110-80 90 70 90-40 120 70 120-60 110 50 130-70 110 60 90-40 120 80v200z" fill="#1d1233"/>
    <g fill="#0c0912">
      <path d="M0 520V450c120-30 200-20 300 0s180 10 260-10l60 10 60-10c80 20 160 10 260 10s220-20 280 0v80z"/>
      <rect x="520" y="250" width="160" height="270"/><path d="M520 250v-22h20v12h20v-12h20v12h20v-12h20v12h20v-12h20v12h20v-12h20v22z"/>
      <rect x="430" y="300" width="62" height="220"/><polygon points="424,300 461,222 498,300"/>
      <rect x="708" y="290" width="62" height="230"/><polygon points="702,290 739,206 776,290"/>
      <rect x="300" y="380" width="130" height="140"/><path d="M300 380v-14h14v8h14v-8h14v8h14v-8h14v8h14v-8h14v14z"/>
      <rect x="770" y="395" width="150" height="125"/><path d="M770 395v-14h14v8h14v-8h14v8h14v-8h14v8h14v-8h14v8h14v-8h14v14z"/>
      <rect x="585" y="170" width="30" height="82"/><polygon points="578,170 600,104 622,170"/>
      <rect x="248" y="340" width="52" height="180"/><polygon points="244,340 274,282 304,340"/>
    </g>
    <g fill="#f0b256" opacity=".9"><rect x="594" y="285" width="12" height="22" rx="6"/><rect x="556" y="330" width="9" height="18" rx="4"/><rect x="635" y="330" width="9" height="18" rx="4"/><rect x="455" y="340" width="9" height="16" rx="4"/><rect x="733" y="335" width="9" height="16" rx="4"/><rect x="594" y="130" width="8" height="14" rx="4"/><rect x="270" y="370" width="8" height="14" rx="4"/><rect x="590" y="440" width="20" height="40" rx="10"/></g>
  </svg>
  <div id="bgimg"></div>
  <video id="bgvideo" muted loop playsinline></video>
  <div id="fx"></div>
  <div id="vignette"></div>
</div>

<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <button class="tb-link" data-open="website">SITIO WEB</button>
      <button class="tb-link" data-open="discord">DISCORD</button>
      <button class="tb-link" id="tbNews">NOTICIAS</button>
      <button class="tb-link" id="tbCredits">INFORMACIÓN</button>
    </div>
    <div class="tb-right">
      <div id="musicCtl" class="chip" title="Música ambiental">
        <button id="mPlay" class="ico" aria-label="Reproducir o pausar">♪</button>
        <input id="mVol" type="range" min="0" max="100" aria-label="Volumen">
        <button id="mMute" class="ico" aria-label="Silenciar">🔊</button>
      </div>
      <button id="updChip" class="chip hidden"></button>
      <button class="win" id="wMin" aria-label="Minimizar">—</button>
      <button class="win" id="wMax" aria-label="Maximizar">▢</button>
      <button class="win close" id="wClose" aria-label="Cerrar">✕</button>
    </div>
  </header>

  <aside id="side">
    <div id="logo">
      <svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true"><path d="M32 3l24 8v18c0 16-10 27-24 32C18 56 8 45 8 29V11z" fill="#1a1226" stroke="#c9a45a" stroke-width="2.5"/><path d="M20 44V26h4v-5h4v5h8v-5h4v5h4v18h-6v-7a4 4 0 00-8 0v7z" fill="#c9a45a"/></svg>
      <div><h1 id="brandName">Aetheria</h1><p id="brandTag"></p></div>
    </div>
    <div class="orn"></div>
    <nav id="sidenav">
      <button data-open="discord">Discord <i>↗</i></button>
      <button data-open="website">Sitio web <i>↗</i></button>
      <button id="navNews">Noticias</button>
      <button id="navInfo">Información del servidor</button>
      <button id="navSettings">Ajustes</button>
    </nav>
    <section id="serverCard" class="card">
      <div class="row"><span id="srvDot" class="dot"></span><strong id="srvState">Comprobando…</strong><span id="srvPing" class="muted"></span></div>
      <div class="kv"><span>Dirección</span><b id="srvAddr">—</b></div>
      <div class="kv"><span>Versión</span><b id="srvVer">—</b></div>
      <div class="kv"><span>Jugadores</span><b id="srvPlayers">—</b></div>
    </section>
    <div class="grow"></div>
    <section id="accountCard" class="card">
      <button id="accBtn" class="acc">
        <img id="accAvatar" alt="" class="avatar"><div><b id="accName">Sin cuenta</b><small id="accType">Pulsa para elegir</small></div><i>⇄</i>
      </button>
      <button id="dcBtn" class="acc small"><img id="dcAvatar" alt="" class="avatar sm hidden"><div><b id="dcName">Vincular Discord</b><small id="dcSub">Opcional</small></div></button>
    </section>
    <section id="playBox">
      <div id="prog" class="hidden">
        <div id="progLabel">Preparando…</div>
        <div class="bar"><div id="progFill"></div></div>
        <div id="progInfo" class="muted"></div>
      </div>
      <button id="playBtn" class="play">JUGAR / UNIRSE</button>
      <button id="cancelBtn" class="ghost hidden">CANCELAR</button>
      <div id="verTag" class="muted">v1.0.0</div>
    </section>
  </aside>

  <main id="main">
    <div id="banners"></div>
    <section id="hero" class="hero hidden"></section>
    <div id="latestHead" class="sect"><h2>Últimas noticias</h2><div class="orn grow"></div><button id="allNews" class="linkbtn">Ver todas</button></div>
    <section id="newsGrid"></section>
    <p id="newsEmpty" class="muted hidden"></p>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<audio id="music" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
